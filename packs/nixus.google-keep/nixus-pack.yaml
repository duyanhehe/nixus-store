format: nixus-pack
spec: 1
id: nixus.google-keep
version: 1.0.4
replaces:
  - javis.google-keep
name: {vi: "Google Keep"}
description: {vi: "Đọc và sửa ghi chú Google Keep: tìm note, tạo note và danh sách việc, gắn nhãn, ghim, lưu trữ. LƯU Ý: Keep không có API chính chủ nên phải dùng master token có TOÀN QUYỀN tài khoản Google, không phải OAuth giới hạn phạm vi như Gmail hay Lịch. Nixus chỉ thao tác được ghi chú, nhưng token thì mở cả tài khoản nếu bị lộ."}
author: {name: Nixus}
license: MIT
homepage: "https://github.com/duyanhehe/nixus-store"
compat: {app: ">=0.55.27"}
provides:
  connectors: [connectors/google-keep.json]
