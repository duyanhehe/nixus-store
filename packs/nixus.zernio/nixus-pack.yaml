description: {vi: "Một câu lệnh, đăng khắp mạng xã hội: Nixus soạn, lên lịch và đăng cùng lúc lên Facebook, Instagram, TikTok, YouTube, LinkedIn, X, Threads, Pinterest và nhiều kênh khác qua MCP chính chủ của Zernio. Xem số liệu, giờ đăng tốt nhất, trả lời bình luận. Đăng ký miễn phí qua link của Nixus, dán API key là xong.", en: "One command, every network: Nixus writes, schedules and publishes to Facebook, Instagram, TikTok, YouTube, LinkedIn, X, Threads, Pinterest and more through Zernio's official MCP. See analytics and best times to post, reply to comments. Sign up free through Nixus's link and paste an API key."}
author: {name: Nixus}
