# Gói "Quản lý khách hàng": tầng CRM cắm vào kho hội thoại khách đa kênh của Nixus AI
# (trang Hội thoại từ 0.60.0, tầng CRM của kho từ 0.60.1). Gói KHÔNG tự đọc tin từ Telegram hay Zalo; việc đó là của
# lõi Nixus. Gói chỉ đọc kho đã có, gắn tag và ghi chú lên khách, tìm khách chờ trả lời, xuất
# danh sách. Nên nó không cần token nào và không mở kết nối ra ngoài.
format: nixus-pack
spec: 1

id: nixus.crm
version: 1.1.1
replaces:
  - javis.khach-hang-crm
  - javis.crm
name:
  vi: Quản lý khách hàng (CRM)
  en: Customer management (CRM)
description:
  vi: Xem khách từ mọi kênh chat, hồ sơ và lịch sử từng người, gắn tag, ghi chú, tìm khách chờ trả lời, thống kê và xuất CSV. Cần Nixus 0.440.0 trở lên.
  en: Customers from every chat channel, per-person profile and history, tags, notes, unanswered queue, stats and CSV export. Needs Nixus 0.440.0 or newer.

author:
  name: Nixus
license: MIT
homepage: https://github.com/duyanhehe/nixus-store

# Tầng CRM của kho hội thoại (server/conversations.py) mới có từ 0.60.1. Bản cũ hơn thì gói bị tắt
# kèm lý do đọc được, thay vì cài xong mà tool nào cũng báo thiếu module.
compat:
  app: ">=0.440.0"

provides:
  plugins:
    - plugins/crm
  skills:
    - skills/cham-soc-khach-hang
  agents:
    - cs-cham-soc-khach
  workflows:
    - ra-soat-khach-hang-ngay
