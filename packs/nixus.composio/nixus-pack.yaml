format: nixus-pack
spec: 1
id: nixus.composio
version: 1.0.3
replaces:
  - javis.composio
name: {vi: "Composio"}
description: {vi: "Cổng đa ứng dụng của Composio: một kết nối mở ra hơn 500 app (Gmail, Notion, Google Sheets, GitHub, Linear, Slack...). Nixus tìm tool, nối tài khoản từng app và chạy hành động qua Composio, không cần Nixus viết connector riêng cho mỗi app. Dán API key (ck_...) là xong."}
author: {name: Nixus}
license: MIT
homepage: "https://github.com/duyanhehe/nixus-store"
compat: {app: ">=0.55.27"}
provides:
  connectors: [connectors/composio.json]
